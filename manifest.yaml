# NOTE: StartOS package ids must match [a-z-]+ (NO digits), so this is `bisq-node`, not `bisq2-node`.
# The user-facing title stays "Bisq 2 Node".
id: bisq-node
title: "Bisq 2 Node"
version: 2.1.12.0
release-notes: |
  Security release: updates the embedded Bisq 2 node to 2.1.12.
  - Required for trading: the Bisq security manager has published an emergency alert requiring version 2.1.12+ — nodes on older versions are blocked from taking or processing offers.
  - Required by Bisq Connect 0.8.2+, which only pairs with nodes running 2.1.12 or newer.
license: AGPL-3.0
wrapper-repo: "https://github.com/bisq-network/bisq2-startos"
upstream-repo: "https://github.com/bisq-network/bisq2"
support-site: "https://github.com/bisq-network/bisq-mobile/issues"
marketing-site: "https://bisq.network"
build: ["make"]
description:
  short: Self-hosted Bisq 2 node for the Bisq Connect mobile app
  long: |
    Run your own Bisq 2 node so the Bisq Connect mobile app connects to a node you control
    instead of a stranger's — more privacy, no third-party trust. The node reaches the Bisq P2P
    network over its own bundled Tor. Open the service's Properties to see the pairing QR code /
    code to pair from Bisq Connect; the service page itself is a read-only status view.

    Heads up: the pairing code grants trade control of your node — keep it private.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
main:
  type: docker
  image: main
  entrypoint: "docker_entrypoint.sh"
  args: []
  mounts:
    main: /data
  gpu-acceleration: false
hardware-requirements:
  arch:
    - x86_64
    - aarch64
# Health: the node has bootstrapped enough to pair once it has written the pairing file.
health-checks:
  pairing-ready:
    name: Pairing ready
    success-message: The node is up and a pairing code is available
    type: script
  node-alive:
    name: Node API responsive
    success-message: The Bisq node API is up and responding (probed via the version endpoint)
    type: script
config: ~
# Properties surface the pairing code (with QR), read from stats.yaml the container writes.
properties:
  type: script
volumes:
  main:
    type: data
# A single static status/landing page over Tor (see web/index.html), served by nginx on :8091.
# It shows NO secrets: pairing is done via the authenticated StartOS Properties view, and this page
# deliberately has no route to the pairing file. The pairing code is a bearer token that grants
# trade control, so it is never exposed to network position or a leaked onion URL.
interfaces:
  main:
    name: Status
    description: A read-only status page. Pairing is done from the service's Properties — the pairing code is never shown here.
    tor-config:
      port-mapping:
        80: "8091"
    ui: true
    protocols:
      - tcp
      - http
dependencies: {}
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/data"
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
